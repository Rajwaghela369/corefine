# Where CoRefine may run calculations. Copy to compute.yaml (not committed) and edit for your machines.
# Every person and site writes their own; nothing here is built into the code.
#
# Placeholders in strings: {QUESTAAL_BIN}, {EXCITING_ROOT} (from .env).
# In slurm script templates: {job_name}, {command} (executable + its arguments), {executable}, {stdout}.

targets:
  local:
    kind: local
    threads: 1                 # OMP_NUM_THREADS per run
    timeout_s: 3600
    codes:
      questaal:
        executable: "{QUESTAAL_BIN}/lmf"
        max_restarts: 3        # lmf continues from its saved density if SCF stopped unconverged
